apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: adot-logs
  namespace: opentelemetry
spec:
  # DaemonSet mode runs one replica per worker node to tail pod logs on the node filesystem
  mode: daemonset
  serviceAccount: adot-collector-sa

  # Root privileges required to read host container logs from /var/log/pods
  podSecurityContext:
    runAsUser: 0
    runAsGroup: 0

  # Ensure collector runs on all worker nodes (including Karpenter spot/system nodes)
  tolerations:
    - operator: Exists
      effect: NoSchedule
    - operator: Exists
      effect: NoExecute

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi

  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods

  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true

  config:
    receivers:
      # Tails container stdout/stderr log files directly on host disk
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/opentelemetry_*/*/*.log
          - /var/log/pods/kube-system_*/*/*.log
        start_at: end

    processors:
      memory_limiter:
        check_interval: 2s
        limit_mib: 400

      # Extract k8s namespace, pod, and container names from file path structured names
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name

      batch:
        timeout: 5s
        send_batch_size: 500

    exporters:
      # Push application logs directly to designated CloudWatch Log Group
      awscloudwatchlogs:
        region: eu-west-1
        log_group_name: "/aws/eks/restaurant-api-eks/dev/containers"
        log_stream_name: "adot-collector-logs"

    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [awscloudwatchlogs]