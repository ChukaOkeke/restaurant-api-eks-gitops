# Overrides default replicaCount for production HA
replicaCount: 3
image:
  # Repo & Tag updated dynamically by GitHub Actions CI pipeline in the GitOps repo
  repository: "618339653656.dkr.ecr.eu-west-1.amazonaws.com/restaurant-api-dev-app"
  tag: "b1ee361"
env:
  awsRegion: "eu-west-1"
  # Production settings file containing logging and cache configurations
  djangoSettingsModule: "config.settings"
  useS3: "True"
  s3BucketName: "restaurant-api-dev-static-assets-618339653656"
  cloudfrontDomain: "asgardcuisines.link"
  sqsQueueUrl: "https://sqs.eu-west-1.amazonaws.com/618339653656/restaurant-api-dev-booking-queue" # Replace with Terraform output
secrets:
  storeName: "aws-secretsmanager"
  appSecretName: "restaurant-api-dev-app-secrets"
  rdsSecretName: "arn:aws:secretsmanager:eu-west-1:618339653656:secret:rds!db-3a4b0dba-8e14-47a3-b313-b826e36c4bb8-e9RJS7" # Replace with Terraform output
  redisSecretName: "restaurant-api-dev-redis-secret"
config:
  DB_HOST: "restaurant-api-dev-db.cvcmaqucsk7w.eu-west-1.rds.amazonaws.com" # Replace with Terraform output
  DB_NAME: "asgard_cuisines_db"
  DB_PORT: 5432
ingress:
  enabled: true
  className: "alb"
  # Matches the Route53-registered domain name for the ALB to route traffic to the API service
  host: "api.asgardcuisines.link"
  # The security group allowing traffic only from CloudFront managed prefix list
  albSecurityGroup: "sg-08484d7f22e70c36a" # Replace with Terraform output
  # ACM certificate for TLS termination at the ALB
  certificateArn: "arn:aws:acm:eu-west-1:618339653656:certificate/8ee77de0-d216-409e-ad2a-fd54fd1e0b38" # Replace with Terraform output
# Resource limits strictly enforced for cost visibility (OpenCost) and K8s stability
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 15
  # Aggressive scaling trigger for the booking engine under load
  targetCPUUtilizationPercentage: 60
