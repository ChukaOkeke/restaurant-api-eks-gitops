# Automatically manages required CRDs (ExternalSecret, SecretStore, ClusterSecretStore)
installCRDs: true

serviceAccount:
  create: true
  # ServiceAccount name mapped to AWS Secrets Manager IAM Role via EKS Pod Identity
  name: "external-secrets-sa"

replicaCount: 2

resources:
  limits:
    cpu: 100m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

# Adjust parallel worker sync threads for rapid secret reconciliation
concurrent: 10