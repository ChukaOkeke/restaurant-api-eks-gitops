# Cluster connection settings
settings:
  clusterName: "restaurant-api-eks"
  # SQS queue for EC2 Spot interruption and rebalance notifications
  interruptionQueue: ""

# Override post-install/pre-delete hook image to bypass Public ECR rate limits and pull from Docker Hub or registry.k8s.io
additionalImagePullSecrets: []

# If your chart version supports hook image overrides:
webhook:
  enabled: false

serviceAccount:
  create: true
  # ServiceAccount mapped to Karpenter Controller IAM Role via EKS Pod Identity
  name: "karpenter-sa"

controller:
  replicas: 2
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi

# Prevents Karpenter pods from scheduling onto Karpenter-managed node pools, only on the static EKS managed node group
nodeSelector:
  karpenter.sh/discovery: "restaurant-api-eks"