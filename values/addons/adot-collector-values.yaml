mode: deployment

image:
  repository: "public.ecr.aws/aws-observability/aws-otel-collector"
  tag: "v0.40.0"

serviceAccount:
  create: true
  # ServiceAccount mapped to AWS CloudWatch & X-Ray IAM Role via EKS Pod Identity
  name: "adot-collector-sa"

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    batch:
      timeout: 1s
      send_batch_size: 1024
    memory_limiter:
      check_interval: 1s
      limit_percentage: 75
      spike_limit_percentage: 15

  exporters:
    awsxray:
      region: "eu-west-1"
    awsemf:
      region: "eu-west-1"
      log_group_name: "/aws/eks/asgardcuisines/opentelemetry"

  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [awsxray]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [awsemf]

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP