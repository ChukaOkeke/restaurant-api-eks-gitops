# Deployment mode for centralized metric scraping and trace collection
mode: deployment

image:
  repository: "public.ecr.aws/aws-observability/aws-otel-collector"
  tag: "v0.40.0"

serviceAccount:
  create: true
  name: "adot-collector-sa"
  annotations:
    # ServiceAccount annotated for EKS Pod Identity / IRSA giving permissions to write to AMP and X-Ray
    eks.amazonaws.com/role-arn: "arn:aws:iam::618339653656:role/restaurant-api-dev-adot-role"

# Disable default Helm chart presets to explicitly define custom pipelines
presets:
  logsCollection:
    enabled: false
  hostMetrics:
    enabled: false
  kubernetesAttributes:
    enabled: false
  kubeletMetrics:
    enabled: false

config:
  # Enable SigV4 authentication extension for Amazon Managed Prometheus (AMP)
  extensions:
    health_check:
      endpoint: 0.0.0.0:13133
    sigv4auth:
      region: "eu-west-1"
      service: "aps"

  receivers:
    # Explicitly nullify uncompiled upstream receivers injected by chart defaults
    jaeger: null
    zipkin: null

    # OTLP Receiver for incoming application traces and metrics (gRPC/HTTP)
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

    # Prometheus scrape config targeting KSM and Node Exporter services
    prometheus:
      config:
        scrape_configs:
          - job_name: "kube-state-metrics"
            scrape_interval: 30s
            static_configs:
              - targets: ["kube-state-metrics.monitoring.svc.cluster.local:8080"]

          - job_name: "prometheus-node-exporter"
            scrape_interval: 30s
            kubernetes_sd_configs:
              - role: endpoints
                namespaces:
                  names: ["monitoring"]
            relabel_configs:
              - source_labels: [__meta_kubernetes_service_name]
                action: keep
                regex: prometheus-node-exporter

  processors:
    batch:
      timeout: 1s
      send_batch_size: 1024
    memory_limiter:
      check_interval: 1s
      limit_percentage: 75
      spike_limit_percentage: 15

  exporters:
    # EXPLICITLY NULLIFY: ADOT collector image does not compile the upstream 'debug' exporter.
    # Setting this to null prevents Helm from merging chart default 'debug: {}' into ConfigMap.
    debug: null

    # AWS X-Ray Exporter for Application Traces
    awsxray:
      region: "eu-west-1"

    # Prometheus Remote Write Exporter configured for AMP endpoint using SigV4 auth
    prometheusremotewrite:
      endpoint: "https://aps-workspaces.eu-west-1.amazonaws.com/workspaces/ws-514f4699-446a-4c71-b38b-f4aa36a9a8f8/api/v1/remote_write"
      auth:
        authenticator: sigv4auth

  service:
    extensions:
      - health_check
      - sigv4auth
    pipelines:
      # Explicitly nullify chart default logs pipeline to drop reference to uncompiled 'debug' exporter
      logs: null
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [awsxray]
      metrics:
        receivers: [otlp, prometheus]
        processors: [memory_limiter, batch]
        exporters: [prometheusremotewrite]

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP