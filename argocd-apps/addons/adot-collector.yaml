# This ArgoCD Application deploys the ADOT Collector resources via Helm to the EKS cluster.
# The ADOT Collector is responsible for collecting telemetry data (metrics, traces, and logs) from the application and sending it to observability backends.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adot-collector-resources
  namespace: argocd
  annotations:
    # Wave 3: Ensures ADOT Operator (Wave 2) is healthy and webhooks are active before creating CRs
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/ChukaOkeke/restaurant-api-eks-gitops.git'
    targetRevision: HEAD
    path: manifests/addons/adot
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: opentelemetry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Bypasses dry-run validation failures if Argo CD cache hasn't refreshed opentelemetry.io CRDs
      - SkipDryRunOnMissingResource=true
    # Retries sync automatically if ADOT operator admission webhooks are still starting up
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m